name: Deploy Elevator Monitoring to Loopia

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elevator-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, validate, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Elevator Monitoring
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm run build:loopia

      - name: Validate deployment artifact
        run: pnpm run validate:loopia

      - name: Deploy to Loopia over encrypted FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ftpcluster.loopia.se
          username: ${{ secrets.LOOPIA_FTP_USERNAME }}
          password: ${{ secrets.LOOPIA_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./loopia-dist/
          server-dir: ./public_html/
          security: strict
          log-level: minimal
          timeout: 120000
